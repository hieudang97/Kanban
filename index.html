<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<style>
  :root {
    --bg:#f5f6fa; --panel:#fff; --text:#0f172a; --muted:#64748b;
    --border:#e5e7eb; --accent:#30D158;
  }
  [data-theme="dark"] {
    --bg:#0b0f1a; --panel:#141a2a; --text:#e8eefc; --muted:#94a3b8;
    --border:rgba(255,255,255,.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui, sans-serif; background:var(--bg); color:var(--text); transition:background .2s; }
  
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 24px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  
  .add-task-form { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
  .add-task-form input, .add-task-form select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .new-btn, .save-btn { background: var(--accent); border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .cancel-btn { background: #ef4444; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; color: white; }
  .icon-btn { background: var(--panel); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  
  .kanban-board { display: flex; gap: 20px; overflow-x: auto; padding: 20px 0; }
  .column { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; min-width: 320px; width: 320px; padding: 16px; }
  .column-header { display: flex; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .task-count { background: var(--bg); padding: 2px 8px; border-radius: 20px; font-size: 12px; }
  .task-list { min-height: 400px; }
  .task-card { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: grab; border-left: 3px solid var(--accent); }
  .task-card:hover { transform: translateY(-2px); }
  .task-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .task-tag { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 6px; margin-right: 8px; }
  .task-tag.DEV { background: #8b5cf6; color: white; }
  .task-tag.OPS { background: #f59e0b; color: white; }
  .task-tag.ECOMP { background: #10b981; color: white; }
  .task-meta { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; gap: 12px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  
  @media (max-width: 700px) {
    .kanban-board { flex-direction: column; }
    .column { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>
    📋 Kanban Board
    <div style="display: flex; gap: 8px;">
      <button class="icon-btn" id="themeBtn">🌓</button>
      <button class="new-btn" id="showAddBtn">+ New Task</button>
    </div>
  </h1>
  
  <div id="addTaskForm" style="display:none;" class="add-task-form">
    <input type="text" id="taskTitle" placeholder="Task title..." style="flex:2">
    <select id="taskTag">
      <option value="DEV">DEV</option>
      <option value="OPS">OPS</option>
      <option value="ECOMP">ECOMP</option>
    </select>
    <select id="taskStatus">
      <option value="Mới">Mới</option>
      <option value="Đang làm">Đang làm</option>
      <option value="Đã xong">Đã xong</option>
    </select>
    <input type="text" id="taskAssignee" placeholder="Assignee" value="Anh Bình" style="flex:1">
    <button class="save-btn" onclick="addNewTask()">Save</button>
    <button class="cancel-btn" onclick="hideForm()">Cancel</button>
  </div>
  
  <div class="kanban-board" id="kanbanBoard">
    <div class="loading">⏳ Loading tasks...</div>
  </div>
</div>

<script>
// 👇👇👇 THAY URL NÀY BẰNG URL APPS SCRIPT CỦA BẠN 👇👇👇
const API_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQHf_fitzuY2JbyxBnlMuOpMHt5gza1Wv3QYfim00mWsythDRIUo-VvyznGmpRI3JEtTr_Nxky36nDec_Vhm0DyreithB1rj9RiGao-G2d2ous-6rjAgU7NpoD0f70Z3YdyMrJuZJyw6nXfScb6BkanxkZviEY5d6LOCOR3OY_Uwz2IaPmO9DV5wQJlJrU4uYI3sMA1hOv17BkBqZ9IeYDKHUswNWtCt_axSSMF39Om4gKpXoCLuuzvZ4fWdRQ8I7_5ePqm-fJfVoTQJOJA8YmXfTcfetnKA5t8SvC1&lib=MAi-51MnhPHbdP1CMzF3CQLX_6e1a697D';

// Theme
const root = document.documentElement;
document.getElementById('themeBtn').onclick = () => {
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
};

// Form
function hideForm() {
  document.getElementById('addTaskForm').style.display = 'none';
  document.getElementById('taskTitle').value = '';
}
document.getElementById('showAddBtn').onclick = () => {
  document.getElementById('addTaskForm').style.display = 'flex';
};

// JSONP Load Tasks
function loadTasks() {
  const board = document.getElementById('kanbanBoard');
  board.innerHTML = '<div class="loading">⏳ Loading tasks...</div>';
  
  const callbackName = 'cb_' + Date.now();
  
  window[callbackName] = function(data) {
    delete window[callbackName];
    const script = document.getElementById('jsonp_script');
    if (script) script.remove();
    
    if (data.success && data.data && data.data.length > 0) {
      renderKanban(data.data);
    } else {
      board.innerHTML = '<div class="loading">📭 No tasks. Click "+ New Task" to create!</div>';
    }
  };
  
  const script = document.createElement('script');
  script.id = 'jsonp_script';
  script.src = `${API_URL}?path=tasks&callback=${callbackName}`;
  script.onerror = () => {
    board.innerHTML = '<div class="loading">🔌 Cannot connect to API. Check URL: ' + API_URL + '</div>';
    delete window[callbackName];
  };
  document.body.appendChild(script);
}

// Add Task
async function addNewTask() {
  const title = document.getElementById('taskTitle')?.value.trim();
  if (!title) return alert('Please enter task title!');
  
  const newTask = {
    title: title,
    tag: document.getElementById('taskTag')?.value,
    status: document.getElementById('taskStatus')?.value,
    assignee: document.getElementById('taskAssignee')?.value,
    due_time: new Date().toLocaleTimeString()
  };
  
  try {
    const res = await fetch(`${API_URL}?path=tasks`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newTask)
    });
    const result = await res.json();
    if (result.success) {
      alert('✅ Task added!');
      hideForm();
      loadTasks();
    } else {
      alert('❌ Error: ' + result.error);
    }
  } catch (err) {
    alert('❌ Error: ' + err.message);
  }
}

// Update Status
async function updateTaskStatus(id, newStatus) {
  try {
    await fetch(`${API_URL}?path=tasks/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    });
    loadTasks();
  } catch (err) {
    console.error(err);
  }
}

// Render
function renderKanban(tasks) {
  const statuses = ['Mới', 'Đang làm', 'Đã xong'];
  const board = document.getElementById('kanbanBoard');
  board.innerHTML = '';
  
  statuses.forEach(status => {
    const columnTasks = tasks.filter(t => t.status === status);
    const col = document.createElement('div');
    col.className = 'column';
    col.innerHTML = `
      <div class="column-header">
        <h3>📌 ${status}</h3>
        <span class="task-count">${columnTasks.length}</span>
      </div>
      <div class="task-list" data-status="${status}">
        ${columnTasks.map(task => `
          <div class="task-card" draggable="true" data-id="${task.id}">
            <div class="task-title">
              <span class="task-tag ${task.tag}">${task.tag}</span>
              ${escapeHtml(task.title)}
            </div>
            <div class="task-meta">
              👤 ${task.assignee || 'Unassigned'} | 🕐 ${task.due_time || ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    board.appendChild(col);
  });
  
  attachDragEvents();
}

// Drag & Drop
function attachDragEvents() {
  const cards = document.querySelectorAll('.task-card');
  const lists = document.querySelectorAll('.task-list');
  
  cards.forEach(card => {
    card.setAttribute('draggable', 'true');
    card.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', card.dataset.id));
  });
  
  lists.forEach(list => {
    list.addEventListener('dragover', e => e.preventDefault());
    list.addEventListener('drop', async e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      const newStatus = list.dataset.status;
      if (id && newStatus) await updateTaskStatus(parseInt(id), newStatus);
    });
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

loadTasks();
</script>
</body>
</html>
